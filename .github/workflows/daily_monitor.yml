name: Daily Momentum Monitor

on:
  schedule:
    # 21:30 UTC = 5:30 PM ET (summer) — ~90 min after US market close
    # Yahoo Finance EOD data is typically available within 30-60 min of close
    - cron: '30 21 * * 1-5'
  workflow_dispatch:   # allow manual trigger from the Actions tab

jobs:
  send-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements_monitor.txt

      - name: Run monitor and send email
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python monitor_gha.py
